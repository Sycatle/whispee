# Development Postgres.
#
# Port 55432 on the host: 5432 and 54322 are already taken on this machine, and a messaging
# server that refuses to start because another project holds the port is a recurring waste of
# time.
services:
  postgres:
    image: postgres:17-alpine
    container_name: whispee_pg
    environment:
      POSTGRES_USER: whispee
      POSTGRES_PASSWORD: dev_only_not_a_secret
      POSTGRES_DB: whispee
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whispee -d whispee"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
