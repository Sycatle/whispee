name: Tests

# Runs the test suites, the linters, and the check that the shipped WebAssembly matches its
# source.
#
# # Why this exists now, when the convention was "nothing builds automatically"
#
# `CONTRIBUTING.md` explains that the mobile workflows stay off `dev` to spend the Actions quota
# on artefacts someone installs rather than on intermediate states. That reasoning is about
# **builds**, and it holds. It does not carry over to tests: 327 of them exist, and until this
# workflow they ran only where someone remembered to run them.
#
# The WebAssembly check is the part that could not be replaced by discipline. The `.wasm` loaded
# by every target is a committed binary, and nothing in the repository related it to
# `crates/crypto-wasm` — so a fix in the cryptography could be merged without reaching anyone,
# and a modified binary committed alone would pass every other check. See `scripts/verify-wasm.sh`.
#
# # What it costs
#
# One Ubuntu runner, and the cache makes the usual run short. Triggering on `pull_request` rather
# than on every push to `dev` keeps the spend on the moment a change is proposed, which is the
# moment the answer is worth having.
#
# # Why `pull_request` carries no branch filter
#
# It carried `branches: [dev, main]`, and that filter reads the **base** of a pull request, not
# the branch the work is on. A pull request based on another pull request's branch — a stack, the
# ordinary way to propose a change that depends on a change still under review — therefore matched
# nothing and ran nothing. Not "ran late": `gh pr checks` reported *no checks reported*, which is
# indistinguishable on screen from a queue that has not started, so the branch sits waiting for a
# verdict that was never going to be produced.
#
# Two things made it worse than a missing run. A `workflow_dispatch` started by hand does not
# attach to the pull request as a check, so it can go green without the pull request noticing. And
# retargeting a pull request onto `dev` afterwards does not replay the event, so the fix that
# looks right — "just point it at `dev`" — leaves it exactly as silent.
#
# So the filter is gone. Every pull request is a change somebody is proposing, whatever it is
# proposed into, and the cost argument above already says that is the moment the answer is worth
# having. A stack of three now costs three runs, which is the correct number: three changes are
# being proposed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time per ref, and the newest wins: a branch pushed three times in a minute should
# answer for its final state, not spend three runners racing to answer for two states nobody will
# ship.
#
# `github.ref` differs between a pull request (`refs/pull/N/merge`) and a branch, so two levels of
# a stack never collide. A **dispatched** run and a pull-request run on the same branch do collide,
# and one cancels the other — which reads as a mysterious `cancelled` rather than as a policy.
# That is the price of grouping by ref, and it is the right price: the alternative groups by event
# and lets two runs of the same commit burn two runners.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the jobs below the change can actually affect.
  #
  # The Rust jobs are the expensive ones — a Postgres service, a release build of the whole
  # workspace including Tauri, and the system libraries the webview needs — and a change that
  # touches only `apps/web` cannot alter their answer. Paying forty minutes to be told again
  # that the cryptography still compiles is the spend `test.yml` argues against everywhere else.
  #
  # **A path filter is a claim that the skipped job had nothing to say, and that claim has to be
  # true.** Two ways it was false here, both fixed rather than accepted:
  #
  #   - The only `vite build` in this workflow lived in the `rust` job, because
  #     `generate_context!()` reads `frontendDist` at compile time. Skipping `rust` on a web-only
  #     change would therefore have removed the sole bundler check from the entire run — the
  #     `web` job runs `typecheck`, `lint` and `test`, and none of them bundle. That build now
  #     runs in `web`, where it belongs, so what the filter drops is genuinely redundant.
  #   - `verify-wasm.sh` compares a **committed binary** against its source. A commit that
  #     touches only `apps/web/public/crypto_wasm_bg.wasm` changes no Rust at all and is exactly
  #     the case that check exists for, so the artefacts it reads are in the filter alongside the
  #     crate that produces them.
  #
  # The workflow file is in every pattern: a change to the filter must be able to prove itself.
  # And anything that is not a pull request — a push to `main`, a dispatch — runs everything,
  # because there is no base to diff against and the safe answer is the complete one.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      audit: ${{ steps.filter.outputs.audit }}

    steps:
      # `fetch-depth: 0`, because the diff is against the base commit and a shallow clone does
      # not contain it. The failure without it is `git diff` exiting on an unknown revision,
      # which would fail the run rather than silently skip — but a filter that cannot fail open
      # is worth having anyway.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ]; then
            echo "Not a pull request: no base to diff against, so everything runs."
            { echo "rust=true"; echo "wasm=true"; echo "audit=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # `grep -q` alone would abort the step under `set -e` when a pattern does not match,
          # which is the ordinary case here rather than an error.
          touched() { echo "$changed" | grep -qE "$1" && echo true || echo false; }

          always='^\.github/workflows/test\.yml$'

          # `apps/desktop` is a workspace member, so its Rust and its `tauri.conf.json` both
          # reach the compiler.
          rust=$(touched "$always|^crates/|^apps/desktop/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^scripts/")

          # The crate, the scripts that build and compare it, and the three committed artefacts
          # the comparison reads.
          wasm=$(touched "$always|^crates/crypto-wasm/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^scripts/(build|verify)-wasm\.sh$|^apps/web/public/crypto_wasm_bg\.wasm$|^apps/web/src/lib/generated/crypto_wasm\.(js|d\.ts)$")

          # `cargo audit` reads `Cargo.lock` and nothing else. Advisories that appear without
          # this repository changing are reported by the scheduled path, not by this one.
          audit=$(touched "$always|^Cargo\.lock$")

          echo "rust=$rust wasm=$wasm audit=$audit"
          { echo "rust=$rust"; echo "wasm=$wasm"; echo "audit=$audit"; } >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The server's tests talk to a real Postgres — nothing is mocked, which is what makes them
    # worth running. Same major version as `docker-compose.yml`; the port is the container's
    # default here, since there is no host Postgres to avoid on a runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whispee
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      # `rustup`, not `dtolnay/rust-toolchain`, and the difference is not a preference.
      #
      # That action takes `toolchain` as a **required** input and never reads
      # `rust-toolchain.toml`; on `@master`, where no branch name supplies a default, its first
      # step exits 1 in twenty milliseconds. This workflow ran twice that way and failed twice,
      # under a comment claiming the file was being read — which is how a dead job looks like a
      # decision. Naming the version here instead would put the pin in every job that needs a
      # compiler, five of them across three workflows, all to be raised together.
      #
      # `rustup` is preinstalled on the runner and reads the file itself: channel, `clippy`, and
      # the WebAssembly target all come from `rust-toolchain.toml`, which is what keeps the
      # WebAssembly comparison reproducible.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # `apps/desktop` is a workspace member, so `--workspace` compiles Tauri whether or not the
      # change being tested touches it, and Tauri links against the system's webview. Without
      # these, `glib-sys`'s build script fails on `pkg-config` and takes the whole job with it —
      # before a single test runs.
      #
      # The alternative was excluding the desktop crates from the command. It was refused: the
      # one bug this repository has found in that code was five commands missing from
      # `generate_handler!`, which compiled cleanly and failed at runtime, and dropping it from
      # CI is how the next one of those gets missed too.
      - name: Tauri's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # And the frontend, for the same reason one step further: `tauri::generate_context!()`
      # reads `frontendDist` **at compile time** and panics in the proc macro if the directory is
      # absent. So `apps/web/dist` is a prerequisite for compiling the workspace, not an artefact
      # of it — which is easy to miss, because a developer's tree always happens to have one.
      #
      # The `web` job builds one too, and the duplication is deliberate rather than an oversight:
      # there it is the check, here it is a build input. Sharing one through an artefact would
      # make this job wait on that one to compile Rust, which is the coupling `changes` exists to
      # remove.
      #
      # `vite build` rather than `pnpm run build`: that script runs `tsc --noEmit` first, and the
      # `web` job already does. No API address is passed, and none exists to pass: the bundle
      # carries no deployment's configuration at all.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the frontend Tauri compiles against
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # No `cargo fmt --check`.
      #
      # This tree is formatted by hand and deliberately: rustfmt wants to rejoin lines that were
      # split to be read, and even with `use_small_heuristics = "Max"` it still disagrees in 189
      # places. Adding the check would mean reformatting the whole codebase against its author's
      # intent, which is a decision about style, not a safety net. Clippy stays, because it
      # reports defects rather than shapes.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      # **`--release`, and this is not a preference.**
      #
      # OpenMLS 0.8.1 runs a `debug_assert!(false)` before returning its decryption error. In a
      # debug build one altered byte in transit panics the process instead of being rejected — a
      # denial of service any remote party can trigger. `ciphertext_altere_rejete` is skipped in
      # debug for that reason, so a debug run would report success while proving nothing about
      # the property that matters most. See CONTRIBUTING.md.
      - name: Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/whispee
        run: cargo test --workspace --release

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # `pnpm run build` runs this too, but on its own it fails in seconds instead of after a
      # bundle.
      - name: Types
        working-directory: apps/web
        run: pnpm run typecheck

      # Its failure means something different from a broken test: not "this does not work" but
      # "this does not hold the invariants" — an unnamed control, a role promised and not
      # implemented, an element made interactive that cannot be reached. The kind of defect that
      # ships happily and is only met by whoever depends on it.
      - name: Lint
        working-directory: apps/web
        run: pnpm run lint

      - name: Tests
        working-directory: apps/web
        run: pnpm test

      # The extension's comparison, which is the part of it that can be checked without a browser.
      #
      # In this job rather than one of its own: it needs node and nothing else, and a job that
      # spends thirty seconds installing a runtime to run nine tests would cost more than it
      # reports. It runs unconditionally for the same reason the rest of this job does — the
      # extension is what makes the published manifest mean anything, and a silent regression in
      # it would turn a green icon into a claim nobody checked.
      - name: Extension
        run: node --test extension/*.test.js

      # The bundle, and it is not decoration.
      #
      # `typecheck`, `lint` and `test` all read the source; none of them resolve an import,
      # follow a dynamic `import()` into its own chunk, or run the CSS pipeline. A dependency
      # that only exists at build time — `pdfjs-dist` reaching for a worker through
      # `new URL(..., import.meta.url)`, an asset expected under `public/` — breaks here and
      # nowhere else.
      #
      # It ran before, but inside the `rust` job, as a prerequisite for
      # `tauri::generate_context!()` rather than as a check of its own. That was fine while
      # `rust` ran on every pull request; it stopped being fine the moment `changes` learned to
      # skip it, because a web-only change would then have been the one kind of change whose
      # bundle nobody built. `rust` still builds its own, for the reason its comment gives.
      - name: Build
        working-directory: apps/web
        run: pnpm exec vite build

  # Separate from `rust` because it needs the WebAssembly target and `wasm-pack`, and because its
  # failure means something different: not "a test broke" but "what ships is not what the source
  # says".
  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # The `wasm32-unknown-unknown` target comes from `rust-toolchain.toml`, like the channel —
      # `rustup` reads both. See the `rust` job for why this is not the action.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: The committed WebAssembly matches its source
        run: ./scripts/verify-wasm.sh

  # Advisories are reported without failing the run, deliberately.
  #
  # A new advisory against a transitive dependency appears without anything in this repository
  # changing, and a job that turns red on someone else's publication blocks unrelated work while
  # teaching nothing. What is wanted is the notification, read by a person who decides.
  #
  # Seven are reported the first time this job actually runs. Six are the OpenMLS crypto path,
  # through `openmls_rust_crypto` -> `hpke-rs` -> `libcrux-*`, and none of them can be fixed from
  # here: the fixed versions are `0.0.x` releases that Cargo does not treat as compatible, so they
  # need `hpke-rs` to bump. Recorded in `docs/THREAT-MODEL.md` rather than silenced here.
  #
  # The seventh is RUSTSEC-2023-0071 against `rsa`, and it is worth knowing why it is not the
  # same kind of finding. `cargo audit` reads `Cargo.lock`, not the dependency graph that is
  # actually built: `rsa` is there through `sqlx-mysql`, a driver this workspace does not enable
  # and does not compile — `cargo tree -i rsa --target all` prints nothing. It is a real entry in
  # the lockfile and inert in every artefact shipped. The rest of the output is `unmaintained`
  # warnings on the GTK crates Tauri pulls in.
  #
  # `continue-on-error` was doing none of that. It stops a failing job from failing what depends
  # on it; the job's own conclusion stays `failure`, so the advisories still turned the run red
  # and still coloured the pull request — exactly the blocking this comment argues against. The
  # command swallows its own exit code instead, and the report stays in the log where it is read.
  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup toolchain install

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Advisories
        run: cargo audit || true
