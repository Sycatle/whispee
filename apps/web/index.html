<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` extends the page under the notch and under the gesture bar; without
      it the system leaves inert bands in the background colour, and `env(safe-area-inset-*)` is
      zero — meaning the insets declared in `index.css` would have no effect.

      `maximum-scale` and `user-scalable` are deliberately absent: they would disable zoom, which
      nobody needs here and which takes away the only recourse a low-vision user has. The input
      field avoids iOS auto-zoom through its font size, not by forbidding the gesture.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Whispee — end-to-end encrypted messaging</title>
    <meta
      name="description"
      content="An MLS (RFC 9420) demonstration. A learning project, not audited."
    />

    <!--
      The colour the system paints around the page: the Android address bar, and the band above
      the safe area. Two declarations because the answer differs by scheme, and sRGB hex because
      `theme-color` is read by the browser chrome rather than by the page, where OKLCH support is
      not something to rely on.

      These duplicate `--color-surface` from `index.css` by hand. That is unfortunate and there
      is no mechanism to avoid it — this file is not processed by Tailwind. If the surface colour
      moves, these move with it; the symptom of forgetting is a seam between the page and the
      system bar, visible only on a phone.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161b" />

    <!--
      Content-Security-Policy, computed at build time from `VITE_API_URL`: see `csp()` in
      `vite.config.ts`, which explains why it is not hard-coded here.
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body class="min-h-dvh antialiased">
    <div id="root"></div>
    <!--
      Where floating surfaces are mounted: menus, dialogs, mobile sheets, toasts.

      A sibling of `#root` rather than a child, so that a portal is never subject to a transform,
      an `overflow: hidden` or a stacking context created somewhere in the layout — the three
      things that silently clip or mis-place a popover. Being last in the document also means it
      wins the paint order without needing a `z-index` to say so.

      Empty in the markup and filled at run time by `ui/Overlays.tsx`. It exists here, as static
      HTML, because the CSP allows no inline script to create it.
    -->
    <div id="overlays"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
