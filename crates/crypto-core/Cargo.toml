[package]
name = "crypto-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# INVARIANT — this crate must NEVER depend on `ratchet-lab`.
# `ratchet-lab` is unaudited teaching code; `crypto-core` is the only production path.
# Any PR adding that dependency must be rejected.

[dependencies]
aes-gcm.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
attest = { path = "../attest" }
# CC0-1.0: public domain, so compatible with the proprietary-code constraint that ruled out
# libsignal. `default-features = false` drops Unicode normalisation, useless for the English
# wordlist alone and far from free in a WASM binary.
bip39 = { version = "2", default-features = false, features = ["alloc"] }
ed25519-dalek.workspace = true
hkdf.workspace = true
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
openmls_traits = "0.5.0"
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
