[package]
name = "crypto-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt 117 (the version bundled with wasm-pack) refuses by default the bulk-memory
# operations rustc emits — even more so since LTO was enabled. Without these flags the
# optimisation fails **silently from the script's point of view**: wasm-pack returns an error
# but the unoptimised .wasm stays in place, and we believe we shipped an optimised binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
]

[dependencies]
attest = { path = "../attest" }
transparency = { path = "../transparency" }
hmac.workspace = true
sha2.workspace = true
crypto-core = { path = "../crypto-core" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"

# OpenMLS needs the JavaScript APIs for randomness and the clock: without the `js` feature,
# compiling to wasm32 fails on purpose (`compile_error!` in openmls/src/lib.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.8.1", features = ["js"] }

# `openmls/js` covers getrandom 0.3, but OpenMLS's elliptic-curve crates (p256/k256/p384, via
# hpke-rs-rust-crypto) still pull rand_core 0.6, hence getrandom 0.2, which refuses to compile
# for wasm32 without its own `js` feature.
#
# This dependency is never called directly: it exists only to enable that feature. Yet it is
# what wires the browser's randomness (`crypto.getRandomValues`) under the key generators —
# broken randomness shows up nowhere and breaks everything.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
serde = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
