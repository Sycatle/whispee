<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` extends the page under the notch and under the gesture bar; without
      it the system leaves inert bands in the background colour, and `env(safe-area-inset-*)` is
      zero — meaning the insets declared in `index.css` would have no effect.

      `maximum-scale` and `user-scalable` are deliberately absent: they would disable zoom, which
      nobody needs here and which takes away the only recourse a low-vision user has. The input
      field avoids iOS auto-zoom through its font size, not by forbidding the gesture.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Whispee — end-to-end encrypted messaging</title>
    <meta
      name="description"
      content="An MLS (RFC 9420) demonstration. A learning project, not audited."
    />

    <!--
      The colour the system paints around the page: the Android address bar, and the band above
      the safe area. Two declarations because the answer differs by scheme, and sRGB hex because
      `theme-color` is read by the browser chrome rather than by the page, where OKLCH support is
      not something to rely on.

      These duplicate `--color-surface` from `index.css` by hand. That is unfortunate and there
      is no mechanism to avoid it — this file is not processed by Tailwind. If the surface colour
      moves, these move with it; the symptom of forgetting is a seam between the page and the
      system bar, visible only on a phone.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161b" />

    <!--
      The application manifest, and what it buys beyond an icon on a home screen.

      Installability is not decoration here: **Safari will not accept a push subscription from a
      site that has not been added to the home screen**, so until this file existed there was no
      version of this client that could be woken on iOS at all. The badge below is the same story
      in miniature — `navigator.setAppBadge` does nothing for a page that is not installed.

      A manifest cannot carry comments, which is why its two colours are argued here instead: it
      declares one `theme_color`, and the two `theme-color` metas above declare two. The light one
      is what the manifest gets, because an installed application's splash screen is painted before
      any script has run and therefore before anything knows which scheme the reader prefers. The
      seam that costs is a light flash on a dark phone, once, at launch.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      The tab icon, and the home-screen icon iOS uses.

      `apple-touch-icon` is opaque where the two manifest icons are not: iOS composites a
      transparent touch icon onto black, which turns a mark drawn for a light background into a
      silhouette. It also applies its own rounded-corner mask, which is why the mark inside it is
      smaller than the proportions the source file has.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      What iOS reads instead of the manifest, because it still does not read the manifest for any
      of this. Without `apple-mobile-web-app-capable` a home-screen launch opens Safari with its
      chrome, which is both worse to use and — the part that matters — is not the installed
      context the Push API requires.

      `black-translucent` puts the page under the status bar, which is the same choice
      `viewport-fit=cover` above already made: `index.css` declares the safe-area insets that pay
      for it, and a different value here would leave an inert band in a colour nothing controls.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Whispee" />

    <!--
      Content-Security-Policy, computed at build time: see `csp()` in `src/lib/csp.ts` and the
      plugin in `vite.config.ts`, which explain why it is not hard-coded here.
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body class="min-h-dvh antialiased">
    <div id="root"></div>
    <!--
      Where floating surfaces are mounted: menus, dialogs, mobile sheets, toasts.

      A sibling of `#root` rather than a child, so that a portal is never subject to a transform,
      an `overflow: hidden` or a stacking context created somewhere in the layout — the three
      things that silently clip or mis-place a popover. Being last in the document also means it
      wins the paint order without needing a `z-index` to say so.

      Empty in the markup and filled at run time by `ui/Overlays.tsx`. It exists here, as static
      HTML, because the CSP allows no inline script to create it.
    -->
    <div id="overlays"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
