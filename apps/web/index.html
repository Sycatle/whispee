<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` étend la page sous l'encoche et sous la barre de geste ; sans lui,
      le système laisse des bandes inertes aux couleurs du fond, et `env(safe-area-inset-*)`
      vaut zéro — c'est-à-dire que les retraits déclarés dans `index.css` seraient sans effet.

      `maximum-scale` et `user-scalable` sont délibérément absents : ils désactiveraient le zoom,
      ce dont personne n'a besoin ici et qui retire à qui voit mal le seul recours dont il
      dispose. Le champ de saisie évite le zoom automatique d'iOS par sa taille de police, pas
      en interdisant le geste.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Whispee — messagerie chiffrée de bout en bout</title>
    <meta
      name="description"
      content="Démonstration MLS (RFC 9420). Projet d'apprentissage, non audité."
    />

    <!--
      Content-Security-Policy, calculée au build à partir de `VITE_API_URL` : voir `csp()` dans
      `vite.config.ts`, qui explique pourquoi elle n'est pas écrite en dur ici.
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body class="min-h-dvh antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
