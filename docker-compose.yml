# Postgres de développement.
#
# Port 55432 côté hôte : 5432 et 54322 sont déjà pris sur cette machine, et un serveur de
# messagerie qui refuse de démarrer parce qu'un autre projet occupe le port est une perte
# de temps récurrente.
services:
  postgres:
    image: postgres:17-alpine
    container_name: whatsapp_clone_pg
    environment:
      POSTGRES_USER: whatsapp_clone
      POSTGRES_PASSWORD: dev_only_not_a_secret
      POSTGRES_DB: whatsapp_clone
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_clone -d whatsapp_clone"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
