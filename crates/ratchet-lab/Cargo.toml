[package]
name = "ratchet-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# WARNING — teaching crate.
#
# This crate reimplements X3DH and the Double Ratchet by hand for the sake of understanding
# them. It is not audited, it does not resist side-channel attacks, and it must NEVER be
# imported by `crypto-core` nor by any code a user runs. The production path goes exclusively
# through OpenMLS.

[dependencies]
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
