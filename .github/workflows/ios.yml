name: iOS build

# Builds the iOS app on a macOS runner.
#
# # Why this workflow never triggers on its own
#
# **A macOS runner minute is billed ten times a Linux one.** It is the repository's decisive
# cost, far ahead of everything else: an automatic iOS build on every push to `main` would eat
# most of the quota by itself.
#
# So there is a single entry point, `workflow_dispatch`, and that is deliberate. Getting an iOS
# binary is a decision, not a side effect of a push. Adding a `push` trigger here — even narrowed
# by `paths` — would be choosing to spend ten times more without anyone asking for it.
#
# # What is not done
#
# No signing, so no binary installable on a real device: that needs an Apple developer account,
# a provisioning profile and a certificate. This workflow builds for the simulator and checks
# that the toolchain holds — which is already what cannot be done anywhere else, since iOS is
# out of reach under Linux.

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Build for a real device rather than the simulator (requires signing)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # The cache counts double here: it saves minutes billed ten times over.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cache the Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # Same choice as for Android: the Xcode project is generated on every build rather than
      # committed, so it cannot drift from `tauri.conf.json`.
      - name: Generate the Xcode project
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8787' }}
        run: cargo tauri ios init

      - name: Build for the simulator
        if: ${{ !inputs.device }}
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8787' }}
        run: cargo tauri ios build --debug --target aarch64-sim

      - name: Build for a device
        if: ${{ inputs.device }}
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8787' }}
        run: cargo tauri ios build --debug

      - uses: actions/upload-artifact@v6
        with:
          name: ios-build
          path: apps/desktop/gen/apple/build/**
          if-no-files-found: error
          retention-days: 7
