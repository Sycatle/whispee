# The Whispee client SDK: everything needed to be a member of a conversation, without a browser.
#
# Apache-2.0, like `wire`, for the reason given there. One caveat the reader should have in
# front of them: this crate depends on `crypto-core`, which is AGPL-3.0. A third party linking
# the SDK therefore links AGPL code, and the permissive licence here does not change that. If
# the SDK is to be usable by anyone outside this repository, `crypto-core` has to move to the
# same licence — it is a library, not a service, and the network clause it was chosen for does
# not apply to it.
[package]
name = "client"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
attest = { path = "../attest" }
crypto-core = { path = "../crypto-core" }
wire = { path = "../wire" }

ed25519-dalek.workspace = true
rand_core.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
