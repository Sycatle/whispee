[workspace]
resolver = "3"
members = ["crates/attest", "crates/transparency", "crates/crypto-core", "crates/crypto-wasm", "crates/ratchet-lab", "crates/server"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"

# Le binaire WASM part sur le réseau à chaque chargement de page : sa taille est un coût
# utilisateur direct. `opt-level` reste à 3 — abaisser l'optimisation d'une bibliothèque
# cryptographique pour gagner quelques kilooctets est un mauvais échange.
[profile.release]
lto = true
codegen-units = 1
strip = true
