[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `tauri-build` reads `tauri.conf.json` and generates the compiled context inside the binary.
# That is also what makes the interface **embedded** rather than downloaded: see the main module's
# note on what this changes in the threat model.
# Mobile loads this crate as a **native library**: the system starts the activity, it calls no
# `main`. Tauri therefore builds with `--lib`, and a crate exposing only a binary fails on
# `no library targets found` — after several minutes of cross-compilation, which makes the
# diagnosis late.
#
# `cdylib` serves Android and iOS; `rlib` lets `main.rs` call the library on desktop. The `_lib`
# suffix avoids a name collision with the binary.
[lib]
name = "desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Tauri's IPC serialises to JSON: a Vec<u8> would become an array of numbers there, over six
# bytes per useful byte. Base64 costs a third of that.
base64 = "0.22"
# The same primitives as the rest of the project: AES-256-GCM for state at rest, Ed25519 for
# requests. Taking the workspace's versions avoids two versions of the same curve one day living
# in the same binary.
aes-gcm.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
zeroize.workspace = true
# The biometric prompt is only implemented on Android and iOS, but the dependency is declared
# **without a target condition**, against what Tauri's examples suggest.
#
# The reason is the build script: it compiles for the host, so `cfg(target_os = "android")` is
# false there even when cross-compiling to Android. A per-target conditional dependency is then
# invisible to `tauri-build`, which refuses the `biometric:default` permission for lack of knowing
# where it would come from — after several minutes of compilation, and with a message about
# permissions rather than dependencies.
tauri-plugin-biometric = "2"
tauri-plugin-opener = "2.5.4"


[features]
# **This flag decides where the interface comes from**, not the build profile.
#
# With it, the webview reads the files packaged in the binary; without it, it goes looking for
# `devUrl` — the Vite server on port 5173 — and shows "Connection refused" if there is none. The
# `tauri build` CLI normally adds it; this project does not use that CLI, so it must declare it
# itself.
#
# On by default, against `create-tauri-app`'s convention: the common case is running the
# application, not working on its interface. For the latter, run `pnpm run dev` in `apps/web` then
# `cargo run -p desktop --no-default-features`, which brings hot reload back.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
