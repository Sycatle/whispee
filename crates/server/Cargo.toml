[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
attest = { path = "../attest" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
ed25519-dalek.workspace = true
hex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The relay's credential scheme is HMAC-SHA1 and accepts nothing else. It authenticates a name
# that expires in hours; see `call::Relay::credential` for why that is the whole of it.
sha1 = "0.10"
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "uuid"] }
thiserror.workspace = true
rand_core.workspace = true
transparency = { path = "../transparency" }
hmac.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
# Already in the tree through axum; declared here because the broadcast hub uses them
# directly.
tokio-stream = { version = "0.1", features = ["sync", "time"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
crypto-core = { path = "../crypto-core" }
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rand_core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
attest = { path = "../attest" }
transparency = { path = "../transparency" }
aes-gcm.workspace = true
# WebSocket client for the tests. Already in the tree: axum uses it for its own `ws` layer.
tokio-tungstenite = "0.29"
futures-util = "0.3"
