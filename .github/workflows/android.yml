name: Android build

# Builds a debug APK on an Ubuntu runner, where the Android SDK is preinstalled.
# No signing: that comes with distribution.
#
# # Saving minutes: what triggers a build, and what doesn't
#
# **Nothing builds on `dev`.** That's the working branch; building on every push there would
# burn most of the quota on intermediate states nobody installs. Work is validated with
# `cargo test`, locally.
#
# That leaves two entry points: a push to `main`, which is an integration, and manual dispatch
# when an APK is wanted without waiting.
#
# No `pull_request` either: a PR from `dev` to `main` would build the same tree twice — once on
# open, once on merge.
#
# The `paths` filter narrows it further: the APK carries neither the server, nor its migrations,
# nor the crypto crates. The WebAssembly module it embeds is a **committed** artefact under
# `apps/web/`, so changing `crates/crypto-wasm` without regenerating it does not change the APK.
#
# # What this workflow installs that a Capacitor project would not have needed
#
# The NDK and a Rust Android target. Tauri compiles native Rust per architecture, where Capacitor
# ships only JavaScript — that is what makes each architecture expensive, and what justifies
# building only one for debug.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/desktop/**"
      - "Cargo.lock"
      - ".github/workflows/android.yml"

# A push that follows another makes the previous one moot: letting it finish pays for a runner
# producing an artefact nobody will take.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # `corepack` provides the pnpm version pinned in `packageManager`, rather than whatever
      # happens to sit on the runner.
      - name: Enable pnpm
        run: corepack enable

      # **One architecture only, and that is a cost measure.**
      #
      # Tauri compiles native Rust per architecture: the four default targets quadruple the
      # compilation of the whole dependency tree, which was enough to come close to a runner's
      # maximum duration as soon as the cache was invalidated.
      #
      # `aarch64` covers most real devices; `armv7` and `x86` are old handsets and emulators
      # respectively. A debug APK needs neither. A release does — and it will get its own
      # workflow, where the spend is justified by an artefact that gets distributed.
      #
      # The channel is `rust-toolchain.toml`'s and not `stable`: a build that compiles with
      # whatever shipped that morning is not the build the pin exists to make reproducible. The
      # target is added here rather than in the file because it belongs to this workflow alone.
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      # The cache is a cost measure as much as a speed one: without it, every build recompiles
      # the entire Rust dependency tree under cross-compilation.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # The SDK is preinstalled on the runner, the NDK is not. Without it, cross-compilation has
      # no linker and fails late, on the first object to link.
      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Cached like the rest: `cargo install` rebuilds the CLI from source, costing several
      # runner minutes on every run.
      - name: Cache the Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The native project is generated on every build rather than committed: `tauri android
      # init` produces a full Gradle project, and a generated project that drifts from its source
      # is a source of silent errors. Regenerating costs a few seconds.
      #
      # No API address is passed. The bundle carries none — the client asks its own origin on the
      # web, and the packaged application asks the person installing it (`apps/desktop/src/
      # server.rs`). Freezing one in here used to produce an application pointing at the phone's
      # own loopback, that is, at nothing.
      - name: Generate the Android project
        working-directory: apps/desktop
        run: cargo tauri android init

      # The camera scans the pairing square, and Android refuses `getUserMedia` without this
      # declaration — silently from the user's point of view, who just sees a camera that never
      # opens.
      #
      # Added here and not in a committed file because `gen/` is regenerated on every build: any
      # manual edit to the manifest would be wiped by the previous step. The day this Android
      # project is committed, this step must go along with the comment explaining it, or the
      # permission ends up declared twice.
      - name: Declare the camera permission
        working-directory: apps/desktop/gen/android/app/src/main
        run: |
          grep -q 'permission.CAMERA' AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' AndroidManifest.xml
          grep -c 'permission.CAMERA' AndroidManifest.xml

      - name: Build the APK
        working-directory: apps/desktop
        run: cargo tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: apps/desktop/gen/android/app/build/outputs/apk/**/*.apk
          # A build that "succeeds" without producing a binary is a silent failure: exactly the
          # kind of misleading success you only notice when it's time to install.
          if-no-files-found: error
          # Artefacts count against the storage quota, and a debug APK is worthless beyond a few
          # days.
          retention-days: 7
