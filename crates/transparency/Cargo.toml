[package]
name = "transparency"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Auditable log of account keys: append-only Merkle tree, inclusion and consistency proofs.
#
# Same reason to exist as the `attest` crate: the producer (`server`) and the verifier
# (`crypto-core`, hence the client) must share **one** definition of the hash function and of the
# tree construction. Two implementations differing by a single byte produce proofs that are
# systematically rejected — or, far worse, a proof accepted for a different tree.
#
# No dependency on OpenMLS: the server does not speak MLS and must not start.

[dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true

[dev-dependencies]
rand_core.workspace = true
