[package]
name = "attest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately tiny crate, with no heavy dependency.
#
# It exists so there is only ONE definition of the canonical attestation message, shared by the
# signer (`crypto-core`) and the verifier (`server`). Two definitions differing by a single byte
# would give a system where signatures are rejected at best, and where field confusion slips
# through at worst — without any unit test on either side revealing it.
#
# It is also what keeps OpenMLS out of the server: the server does not speak MLS, and must not
# start.

[dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true

[dev-dependencies]
rand_core.workspace = true
