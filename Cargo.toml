[workspace]
resolver = "3"
members = ["crates/attest", "crates/transparency", "crates/crypto-core", "crates/crypto-wasm", "crates/ratchet-lab", "crates/server", "apps/desktop"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"

# The WASM binary crosses the network on every page load: its size is a direct cost to the
# user. `opt-level` stays at 3 — lowering the optimisation of a cryptographic library to save a
# few kilobytes is a bad trade.
[profile.release]
lto = true
codegen-units = 1
strip = true
