[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
attest = { path = "../attest" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
ed25519-dalek.workspace = true
hex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "uuid"] }
thiserror.workspace = true
rand_core.workspace = true
transparency = { path = "../transparency" }
hmac.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
# Déjà présentes dans l'arbre via axum ; déclarées ici parce que le hub de diffusion les
# utilise directement. Licences MIT et MIT/Apache-2.0, compatibles avec du code propriétaire.
tokio-stream = { version = "0.1", features = ["sync", "time"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
crypto-core = { path = "../crypto-core" }
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rand_core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
attest = { path = "../attest" }
transparency = { path = "../transparency" }
aes-gcm.workspace = true
