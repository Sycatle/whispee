[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `tauri-build` lit `tauri.conf.json` et génère le contexte compilé dans le binaire. C'est aussi
# ce qui fait que l'interface est **embarquée** plutôt que téléchargée : voir la note du module
# principal sur ce que cela change dans le modèle de menace.
# Le mobile charge cette crate comme **bibliothèque native** : le système démarre l'activité, il
# n'appelle aucun `main`. Tauri compile donc avec `--lib`, et une crate qui n'expose qu'un binaire
# échoue sur `no library targets found` — après plusieurs minutes de compilation croisée, ce qui
# rend le diagnostic tardif.
#
# `cdylib` sert Android et iOS ; `rlib` permet à `main.rs` d'appeler la bibliothèque sur bureau.
# Le suffixe `_lib` évite la collision de noms avec le binaire.
[lib]
name = "desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# **Ce drapeau décide d'où vient l'interface**, et non le profil de compilation.
#
# Avec lui, la webview lit les fichiers empaquetés dans le binaire ; sans lui, elle va chercher
# `devUrl` — le serveur Vite sur le port 5173 — et affiche « Connection refused » s'il n'y en a
# pas. C'est le CLI `tauri build` qui l'ajoute d'ordinaire ; ce projet n'utilise pas ce CLI, donc
# il doit le déclarer lui-même.
#
# Activé par défaut, à rebours de la convention de `create-tauri-app` : le cas courant est de
# lancer l'application, pas de travailler sur son interface. Pour ce dernier cas, lancer
# `pnpm run dev` dans `apps/web` puis `cargo run -p desktop --no-default-features`, ce qui rend
# le rechargement à chaud.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
