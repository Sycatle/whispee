# By default pnpm refuses to run a dependency's install scripts: a post-install script runs with
# all of the user's privileges, and that is a very real supply-chain compromise path. Every
# exception is therefore declared here, one by one.
#
# `esbuild` downloads its native binary at install time. It is Vite's transpiler: without it,
# nothing builds. Allowing it is not a way around the guard rail, it is what the guard rail asks
# for — an explicit decision rather than a blanket permission.
allowBuilds:
  esbuild: true
